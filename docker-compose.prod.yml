# Production stack (VPS): static practice ballot served by nginx.
# Joins 360ws-network so Nginx Proxy Manager can reach kent-ballot-app:80.
# Public host: https://ballot.360web.cloud
# Loopback health check: 127.0.0.1:8033

name: kent-ballot

services:
  app:
    build: .
    image: kent-ballot:latest
    container_name: kent-ballot-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PUBLISH_PORT:-8033}:80"
    networks:
      - proxy
    labels:
      - "com.360ws.type=docker-app"
      - "com.360ws.app=kent-ballot"
      - "com.360ws.domain=ballot.360web.cloud"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
    name: 360ws-network
